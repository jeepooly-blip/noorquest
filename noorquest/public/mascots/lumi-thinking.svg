<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Lumi the Lantern — thinking">
  <title>Lumi — thinking</title>
  <defs>
    <radialGradient id="lumi-body-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="55%" stop-color="#FFC861"/>
      <stop offset="100%" stop-color="#E89A2B"/>
    </radialGradient>
    <radialGradient id="lumi-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE17A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFE17A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lumi-cap-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E5A1F"/>
      <stop offset="100%" stop-color="#6B3A0E"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="125" r="95" fill="url(#lumi-glow)"/>

  <!-- thought bubble dots -->
  <g fill="#FFFFFF" stroke="#C77A1E" stroke-width="2">
    <circle cx="155" cy="60" r="6"/>
    <circle cx="168" cy="44" r="9"/>
  </g>
  <text x="168" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#3A1A05">?</text>

  <!-- cap -->
  <rect x="64" y="34" width="72" height="22" rx="4" fill="url(#lumi-cap-grad)"/>
  <rect x="62" y="52" width="76" height="8" rx="3" fill="#5A2F08"/>
  <path d="M100 22 Q100 8 110 8" fill="none" stroke="#5A2F08" stroke-width="4" stroke-linecap="round"/>
  <circle cx="112" cy="8" r="5" fill="none" stroke="#5A2F08" stroke-width="4"/>

  <!-- glass body -->
  <ellipse cx="100" cy="140" rx="58" ry="74" fill="url(#lumi-body-grad)" stroke="#C77A1E" stroke-width="3"/>

  <!-- small flame -->
  <path d="M100 102 Q92 122 95 138 Q100 150 100 162 Q100 150 105 138 Q108 122 100 102 Z" fill="#FF6B1A" opacity="0.8"/>
  <path d="M100 116 Q96 130 97 140 Q100 148 100 156 Q100 148 103 140 Q104 130 100 116 Z" fill="#FFD24A"/>

  <!-- face — looking up thinking eyes -->
  <g fill="#3A1A05">
    <circle cx="82" cy="130" r="4"/>
    <circle cx="118" cy="130" r="4"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="83.5" cy="128.5" r="1.2"/>
    <circle cx="119.5" cy="128.5" r="1.2"/>
  </g>

  <!-- thoughtful mouth -->
  <path d="M92 158 Q100 154 108 158" fill="none" stroke="#3A1A05" stroke-width="3.5" stroke-linecap="round"/>

  <!-- cheeks -->
  <circle cx="74" cy="148" r="4" fill="#FF9D6E" opacity="0.5"/>
  <circle cx="126" cy="148" r="4" fill="#FF9D6E" opacity="0.5"/>

  <!-- base -->
  <rect x="70" y="210" width="60" height="10" rx="3" fill="url(#lumi-cap-grad)"/>
  <rect x="78" y="220" width="44" height="6" rx="2" fill="#3A1A05"/>
</svg>
